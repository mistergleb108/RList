<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Списки</h1>
                <button id="newListBtn" class="btn btn-secondary">
                    <span class="btn-icon">+</span> Новый список
                </button>
            </div>

            <div class="settings-panel">
                <div class="settings-group">
                    <label class="setting-checkbox">
                        <input type="checkbox" id="checkDuplicatesCheckbox" checked>
                        <span class="checkmark"></span>
                        <span class="setting-label">Проверять дубликаты</span>
                    </label>
                    <label class="setting-checkbox">
                        <input type="checkbox" id="extractIdCheckbox" checked>
                        <span class="checkmark"></span>
                        <span class="setting-label">Проверка на ID</span>
                    </label>
                </div>
            </div>
        </header>

        <div class="lists-menu">
            <div class="lists-scroll">
                <div class="lists-container" id="listsContainer">
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="addFromClipboard" class="btn btn-primary">
                <span class="btn-icon">📋</span> Из буфера
            </button>
        </div>

        <div class="list-container-wrapper">
            <div class="list-header">
                <span>Элементы: <span id="itemCount">0</span></span>
                <div class="list-name-display">
                    <span id="currentListName">Новый список</span>
                </div>
            </div>
            <div class="list-container">
                <ul id="itemList" class="list-items">
                    <li class="empty-list">Список пуст</li>
                </ul>
            </div>
        </div>

        <div class="secondary-controls">
            <button id="addEmpty" class="btn btn-secondary">
                <span class="btn-icon">+</span> Новая строка
            </button>
            <button id="clearList" class="btn btn-danger">
                <span class="btn-icon">×</span> Очистить
            </button>
            <button id="exportMenuBtn" class="btn btn-export">
                <span class="btn-icon">📋</span> Экспорт
            </button>
        </div>

        <div class="footer-controls">
            <button id="deleteListBtn" class="btn btn-danger btn-small">
                <span class="btn-icon">🗑️</span> Удалить список
            </button>
        </div>
    </div>

    <!-- Диалог экспорта -->
    <div class="export-overlay" id="exportOverlay">
        <div class="export-dialog">
            <h3>Экспорт списка</h3>
            <div class="export-options">
                <div class="export-option">
                    <input type="radio" id="exportWithoutName" name="exportOption" value="withoutName" checked>
                    <label for="exportWithoutName">Экспорт без названия</label>
                </div>
                <div class="export-option">
                    <input type="radio" id="exportWithName" name="exportOption" value="withName">
                    <label for="exportWithName">Экспорт с названием списка</label>
                </div>
            </div>
            <textarea id="exportTextarea" readonly class="export-textarea"></textarea>
            <div class="export-buttons">
                <button id="copyExportBtn" class="btn btn-primary">
                    <span class="btn-icon">📋</span> Копировать
                </button>
                <button id="cancelExportBtn" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- Диалог редактирования названия -->
    <div class="edit-name-overlay" id="editNameOverlay">
        <div class="edit-name-dialog">
            <h3>Редактировать название</h3>
            <input type="text" id="editNameInput" class="edit-name-input" placeholder="Название списка">
            <div class="edit-name-buttons">
                <button id="saveNameBtn" class="btn btn-primary">
                    <span class="btn-icon">✓</span> Сохранить
                </button>
                <button id="cancelEditNameBtn" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3>Очистить список?</h3>
            <p>Вы уверены, что хотите удалить все элементы списка? Это действие нельзя отменить.</p>
            <div class="confirm-buttons">
                <button id="confirmClear" class="btn btn-danger">
                    <span class="btn-icon">×</span> Очистить
                </button>
                <button id="cancelClear" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmDeleteListOverlay">
        <div class="confirm-dialog">
            <h3>Удалить список?</h3>
            <p>Вы уверены, что хотите удалить этот список? Это действие нельзя отменить.</p>
            <div class="confirm-buttons">
                <button id="confirmDeleteList" class="btn btn-danger">
                    <span class="btn-icon">🗑️</span> Удалить
                </button>
                <button id="cancelDeleteList" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <span id="notificationText"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
