<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Списки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAADoSURBVHhe7ZmxDcIwFAWdzBE6OjZAMAWLZJQMlU3IHqGjOBCSJUcE7p3k5sqTrS/b3fF2WouYnsJGAlDYSAAKGwlAYSMBKGwkAIWNrvYuMI4j1a6YponqI/odkAAUNhKAwkazAGvpN19b0GwMrqUv18uZuinzPFO9kDFYSQJQ7Jn7sjxXK34qwBYkAIWNBKCwkQAUNhKAwkYCUNhIAAobCUBhIwEobCQAhQ19gGb/AqTlw+U7DsNAVUr+BerRB9jsCHyLHIFKEoDCRgJQ2KieAv+GfgckAIWNBKCwkQAUNhKAwkYCUNh4AKVTPlsOukVOAAAAAElFTkSuQmCC" type="image/png">
</head>

<body>
    <!-- Логотип - меняется в зависимости от размера экрана -->
    <a href="https://mistergleb108.github.io/RHomepage/" class="logo-link" title="Перейти на главную">
        <div class="logo">
            <!-- Изображение будет заменено через JavaScript -->
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAACASURBVEhL7ZSxDcAgDARNSjZhIHpGc89AXicFDTFRHilYCMlXwVOcjMEhxkiWXDpYjQsg5oIwviJmVsk8pRSVmFdwvgD0IOf8OBuotfbbA3sgIiKi046/AogLIC6AmAvAqGh8fyUiSim1xYZRMVXBPBsqMBe8XNFazCtwAcRccAO+Uxf5UKCkKQAAAABJRU5ErkJggg==" />
        </div>
    </a>

    <div class="container">
        <header>
            <div class="header-top">
                <h1>Списки</h1>
            </div>
            
            <div class="list-management-container">
                <div class="lists-menu">
                    <div class="lists-scroll">
                        <div class="lists-container" id="listsContainer">
                            <!-- Кнопка добавления списка будет добавлена здесь -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="controls">
            <button id="addFromClipboard" class="btn btn-primary">
                <span class="btn-icon">📋</span> Из буфера
            </button>
        </div>

        <div class="list-container-wrapper">
            <div class="resize-handle" title="Изменить высоту">
                <span class="resize-icon">↕</span>
            </div>
            <div class="list-header">
                <span>Элементы: <span id="itemCount">0</span></span>
            </div>
            <div class="list-container">
                <ul id="itemList" class="list-items">
                    <li class="empty-list">Список пуст</li>
                </ul>
            </div>
        </div>

        <!-- Панель настроек (под списком) -->
        <div class="settings-panel-bottom">
            <div class="settings-group-bottom">
                <label class="setting-checkbox-bottom">
                    <input type="checkbox" id="checkDuplicatesCheckbox" checked>
                    <span class="checkmark"></span>
                    <span class="setting-label-bottom">Проверять на дубликаты</span>
                </label>
                <label class="setting-checkbox-bottom">
                    <input type="checkbox" id="extractIdCheckbox" checked>
                    <span class="checkmark"></span>
                    <span class="setting-label-bottom">Вставлять только ID</span>
                </label>
            </div>
        </div>

        <div class="secondary-controls">
            <button id="addEmpty" class="btn btn-secondary">
                <span class="btn-icon">+</span> Новая строка
            </button>
            <button id="clearList" class="btn btn-danger">
                <span class="btn-icon">×</span> Очистить
            </button>
            <button id="exportMenuBtn" class="btn btn-export">
                <span class="btn-icon">📋</span> Экспорт
            </button>
        </div>

        <div class="footer-controls">
            <!-- Пустой футер или другие элементы, если нужны -->
        </div>
    </div>

    <!-- Диалог создания/редактирования названия списка -->
    <div class="overlay" id="createListOverlay">
        <div class="dialog">
            <h3 id="createListTitle">Новый список</h3>
            <input type="text" id="createListInput" class="dialog-input" placeholder="Название списка" value="Новый список">
            <div class="dialog-buttons">
                <button id="createListConfirm" class="btn btn-primary">
                    <span class="btn-icon">✓</span> Создать
                </button>
                <button id="createListCancel" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- Диалог редактирования названия -->
    <div class="overlay" id="editNameOverlay">
        <div class="dialog">
            <h3>Редактировать название</h3>
            <input type="text" id="editNameInput" class="dialog-input" placeholder="Название списка">
            <div class="dialog-buttons">
                <button id="saveNameBtn" class="btn btn-primary">
                    <span class="btn-icon">✓</span> Сохранить
                </button>
                <button id="cancelEditNameBtn" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- Диалог экспорта -->
    <div class="export-overlay" id="exportOverlay">
        <div class="export-dialog">
            <h3>Экспорт списка</h3>
            <div class="export-options">
                <div class="export-option">
                    <input type="radio" id="exportWithoutName" name="exportOption" value="withoutName" checked>
                    <label for="exportWithoutName">Экспорт без названия</label>
                </div>
                <div class="export-option">
                    <input type="radio" id="exportWithName" name="exportOption" value="withName">
                    <label for="exportWithName">Экспорт с названием списка</label>
                </div>
            </div>
            <textarea id="exportTextarea" readonly class="export-textarea"></textarea>
            <div class="export-buttons">
                <button id="copyExportBtn" class="btn btn-primary">
                    <span class="btn-icon">📋</span> Копировать
                </button>
                <button id="cancelExportBtn" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- Диалог подтверждения очистки -->
    <div class="overlay" id="confirmOverlay">
        <div class="dialog confirm-dialog">
            <h3>Очистить список?</h3>
            <p>Вы уверены, что хотите удалить все элементы списка? Это действие нельзя отменить.</p>
            <div class="confirm-buttons">
                <button id="confirmClear" class="btn btn-danger">
                    <span class="btn-icon">×</span> Очистить
                </button>
                <button id="cancelClear" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <!-- Диалог подтверждения удаления списка -->
    <div class="overlay" id="confirmDeleteListOverlay">
        <div class="dialog confirm-dialog">
            <h3>Удалить список?</h3>
            <p>Вы уверены, что хотите удалить этот список? Это действие нельзя отменить.</p>
            <div class="confirm-buttons">
                <button id="confirmDeleteList" class="btn btn-danger">
                    <span class="btn-icon">🗑️</span> Удалить
                </button>
                <button id="cancelDeleteList" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <span id="notificationText"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
