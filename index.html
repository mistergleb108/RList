<body>
    <div class="container">
        <header>
            <h1>Список</h1>
        </header>

        <div class="controls">
            <button id="addFromClipboard" class="btn btn-primary">
                <span class="btn-icon">📋</span> Из буфера
            </button>
            <button id="addEmpty" class="btn btn-secondary">
                <span class="btn-icon">+</span> Новая строка
            </button>
            <button id="clearList" class="btn btn-danger">
                <span class="btn-icon">×</span> Очистить
            </button>
            <button id="toggleDuplicates" class="btn btn-toggle">
                <span class="btn-icon" id="toggleIconDuplicates">✓</span> Удалять дубликаты
            </button>
        </div>

        <div class="list-container-wrapper">
            <div class="list-header">
                <span>Элементы: <span id="itemCount">0</span></span>
            </div>
            <div class="list-container">
                <ul id="itemList" class="list-items">
                    <li class="empty-list">Список пуст</li>
                </ul>
            </div>
        </div>

        <div class="export-section">
            <div class="export-header" id="exportToggle">
                <h3>Экспорт</h3>
                <span class="toggle-icon" id="toggleIcon">▶</span>
            </div>
            <div class="export-content" id="exportContent">
                <textarea id="exportTextarea" placeholder="Список для экспорта..."></textarea>
                <div class="export-controls">
                    <button id="exportBtn" class="btn btn-primary">
                        <span class="btn-icon">↓</span> Экспорт
                    </button>
                    <button id="downloadBtn" class="btn btn-secondary">
                        <span class="btn-icon">⤓</span> Скачать
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3>Очистить список?</h3>
            <p>Вы уверены, что хотите удалить все элементы списка? Это действие нельзя отменить.</p>
            <div class="confirm-buttons">
                <button id="confirmClear" class="btn btn-danger">
                    <span class="btn-icon">×</span> Очистить
                </button>
                <button id="cancelClear" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
