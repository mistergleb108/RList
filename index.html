    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHZpZXdCb3g9IjAgMCA2NCA2NCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiBmaWxsPSIjMTUxNTE1Ii8+CjxwYXRoIGQ9Ik0xOCAxOEg0NlY0NkgxOFYxOFoiIGZpbGw9IiM0QTZGQTUiLz4KPHBhdGggZD0iTTE4IDE4VjQyTDI4IDMyTDE4IDIyVjE4WiIgZmlsbD0iIzJENTkzRCIvPgo8cGF0aCBkPSJNNDYgMThWNDJMMzYgMzJINDZWMjJWMThaIiBmaWxsPSIjNkQyQTNDIi8+CjxwYXRoIGQ9Ik0yNCAyNEg0MFY0MEgyNFYyNFoiIGZpbGw9IiNmZmZmZmYiLz4KPGxpbmUgeDE9IjI4IiB5MT0iMjYiIHgyPSIzNiIgeTI9IjI2IiBzdHJva2U9IiM0QTZGQTUiIHN0cm9rZS13aWR0aD0iMiIvPgo8bGluZSB4MT0iMjgiIHkxPSIzMCIgeDI9IjM2IiB5Mj0iMzAiIHN0cm9rZT0iIzRBNkZBNSIgc3Ryb2tlLXdpZHRoPSIyIi8+CjxsaW5lIHgxPSIyOCIgeTE9IjM0IiB4Mj0iMzYiIHkyPSIzNCIgc3Ryb2tlPSIjNEE2RkE1IiBzdHJva2Utd2lkdGg9IjIiLz4KPGxpbmUgeDE9IjI4IiB5MT0iMzgiIHgyPSIzNiIgeTI9IjM4IiBzdHJva2U9IiM0QTZGQTUiIHN0cm9rZS13aWR0aD0iMiIvPgo8Y2lyY2xlIGN4PSIyNiIgY3k9IjI3IiByPSIyIiBmaWxsPSIjMkQ1OTNEIi8+CjxjaXJjbGUgY3g9IjI2IiBjeT0iMzEiIHI9IjIiIGZpbGw9IiMyRDU5M0QiLz4KPGNpcmNsZSBjeD0iMjYiIGN5PSIzNSIgcj0iMiIgZmlsbD0iIzJENTkzRCIvPgo8Y2lyY2xlIGN4PSIyNiIgY3k9IjM5IiByPSIyIiBmaWxsPSIjMkQ1OTNEIi8+CjxwYXRoIGQ9Ik0yMiAzMkwxOCAyOFYzNkwyMiAzMloiIGZpbGw9IiNmZmZmZmYiIGZpbGwtb3BhY2l0eT0iMC4zIi8+CjxwYXRoIGQ9Ik00MiAzMkw0NiAyOFYzNkw0MiAzMloiIGZpbGw9IiNmZmZmZmYiIGZpbGwtb3BhY2l0eT0iMC4zIi8+Cjwvc3ZnPgo="
    type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            background-color: #0a0a0a;
            color: #f0f0f0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: #151515;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid #2a2a2a;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            min-width: 160px;
        }
        
        .btn-primary {
            background-color: #4a6fa5;
            border: 1px solid #5a7fb5;
        }
        
        .btn-primary:hover {
            background-color: #5a7fb5;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.3);
        }
        
        .btn-secondary {
            background-color: #2d593d;
            border: 1px solid #3d694d;
        }
        
        .btn-secondary:hover {
            background-color: #3d694d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(45, 89, 61, 0.3);
        }
        
        .btn-danger {
            background-color: #6d2a3c;
            border: 1px solid #7d3a4c;
        }
        
        .btn-danger:hover {
            background-color: #7d3a4c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(109, 42, 60, 0.3);
        }
        
        .btn:disabled {
            background-color: #2a2a2a;
            color: #666;
            border: 1px solid #333;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-icon {
            margin-right: 10px;
            font-size: 1.1em;
        }
        
        .list-container-wrapper {
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            background-color: #1a1a1a;
            height: 500px;
            /* Фиксированная высота */
            display: flex;
            flex-direction: column;
        }
        
        .list-header {
            background-color: #222;
            padding: 14px 20px;
            font-weight: 500;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #aaa;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .list-container {
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .list-items {
            list-style-type: none;
            min-height: 100%;
        }
        
        .list-item {
            padding: 0;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            transition: background-color 0.2s;
            min-height: 50px;
            /* Более узкая минимальная высота */
        }
        
        .list-item:hover {
            background-color: #222;
        }
        
        .list-item:last-child {
            border-bottom: none;
        }
        
        .list-item-content {
            flex-grow: 1;
            margin-right: 10px;
            word-break: break-word;
            display: flex;
            align-items: stretch;
            min-height: 50px;
            /* Более узкая минимальная высота */
        }
        
        .list-item-input {
            width: 100%;
            padding: 12px 16px;
            background-color: transparent;
            border: none;
            border-radius: 0;
            font-size: 0.95rem;
            color: #f0f0f0;
            transition: all 0.2s;
            font-family: inherit;
            min-height: 50px;
            box-sizing: border-box;
            line-height: 1.4;
            resize: none;
            overflow: hidden;
            white-space: pre-wrap;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        
        .list-item-input:focus {
            background-color: #252525;
            outline: none;
        }
        
        .list-item-input::placeholder {
            color: #666;
            font-style: italic;
        }
        
        .list-item-actions {
            display: flex;
            padding-right: 12px;
            flex-shrink: 0;
            align-items: center;
            gap: 5px;
        }
        
        .list-item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            color: #888;
        }
        
        .rutube-btn {
            color: #ff2e4d;
            background-color: rgba(255, 46, 77, 0.1);
        }
        
        .rutube-btn:hover {
            background-color: rgba(255, 46, 77, 0.2);
        }
        
        .delete-btn {
            color: #888;
            background-color: rgba(136, 136, 136, 0.1);
        }
        
        .delete-btn:hover {
            color: #ff6b7d;
            background-color: rgba(255, 107, 125, 0.1);
        }
        
        .empty-list {
            padding: 40px 20px;
            text-align: center;
            color: #555;
            font-style: italic;
            font-size: 1rem;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .export-section {
            background-color: #1a1a1a;
            border-radius: 10px;
            margin-top: 30px;
            border: 1px solid #2a2a2a;
            overflow: hidden;
        }
        
        .export-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .export-header:hover {
            background-color: #222;
        }
        
        .export-header h3 {
            margin: 0;
            color: #ffffff;
            font-weight: 400;
            font-size: 1.2rem;
        }
        
        .toggle-icon {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
            color: #4a6fa5;
        }
        
        .export-content {
            padding: 20px;
            border-top: 1px solid #2a2a2a;
            display: none;
        }
        
        .export-content.expanded {
            display: block;
        }
        
        .export-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            background-color: #222;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #f0f0f0;
            margin-bottom: 16px;
            resize: vertical;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            line-height: 1.4;
        }
        
        textarea:focus {
            border-color: #4a6fa5;
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2);
        }
        
        textarea::placeholder {
            color: #666;
        }
        
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        
        .confirm-dialog {
            background-color: #222;
            border-radius: 10px;
            padding: 24px;
            max-width: 380px;
            width: 90%;
            border: 1px solid #2a2a2a;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }
        
        .confirm-dialog h3 {
            color: #ffffff;
            margin-bottom: 16px;
            font-weight: 400;
            font-size: 1.3rem;
            text-align: center;
        }
        
        .confirm-dialog p {
            color: #aaa;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        
        .confirm-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        
        .confirm-buttons .btn {
            min-width: 110px;
            padding: 12px 20px;
            font-size: 0.95rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 280px;
                padding: 12px 20px;
            }
            .export-controls {
                flex-direction: column;
                align-items: center;
            }
            .confirm-buttons {
                flex-direction: column;
                align-items: center;
            }
            .confirm-buttons .btn {
                width: 100%;
                max-width: 220px;
            }
            .list-item {
                flex-direction: column;
                align-items: stretch;
            }
            .list-item-content {
                width: 100%;
                margin-right: 0;
            }
            .list-item-input {
                padding: 10px 14px;
                font-size: 0.9rem;
            }
            .list-item-actions {
                padding: 0 14px 10px 14px;
                justify-content: flex-end;
            }
            .list-container-wrapper {
                height: 400px;
                /* Меньшая высота на мобильных */
            }
            .list-item,
            .list-item-content,
            .list-item-input {
                min-height: 45px;
            }
        }
        /* Стили для скроллбара */
        
        .list-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .list-container::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        .list-container::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        
        .list-container::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        /* Стили для моноширинного шрифта для ID */
        
        .id-highlight {
            color: #4a9eff;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Список</h1>
        </header>

        <div class="controls">
            <button id="addFromClipboard" class="btn btn-primary">
                <span class="btn-icon">📋</span> Из буфера
            </button>
            <button id="addEmpty" class="btn btn-secondary">
                <span class="btn-icon">+</span> Новая строка
            </button>
            <button id="clearList" class="btn btn-danger">
                <span class="btn-icon">×</span> Очистить
            </button>
        </div>

        <div class="list-container-wrapper">
            <div class="list-header">
                <span>Элементы: <span id="itemCount">0</span></span>
            </div>
            <div class="list-container">
                <ul id="itemList" class="list-items">
                    <li class="empty-list">Список пуст</li>
                </ul>
            </div>
        </div>

        <div class="export-section">
            <div class="export-header" id="exportToggle">
                <h3>Экспорт</h3>
                <span class="toggle-icon" id="toggleIcon">▶</span>
            </div>
            <div class="export-content" id="exportContent">
                <textarea id="exportTextarea" placeholder="Список для экспорта..."></textarea>
                <div class="export-controls">
                    <button id="exportBtn" class="btn btn-primary">
                        <span class="btn-icon">↓</span> Экспорт
                    </button>
                    <button id="downloadBtn" class="btn btn-secondary">
                        <span class="btn-icon">⤓</span> Скачать
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Диалог подтверждения очистки -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3>Очистить список?</h3>
            <p>Вы уверены, что хотите удалить все элементы списка? Это действие нельзя отменить.</p>
            <div class="confirm-buttons">
                <button id="confirmClear" class="btn btn-danger">
                    <span class="btn-icon">×</span> Очистить
                </button>
                <button id="cancelClear" class="btn btn-secondary">
                    <span class="btn-icon">←</span> Отмена
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM элементы
        const itemList = document.getElementById('itemList');
        const addFromClipboardBtn = document.getElementById('addFromClipboard');
        const addEmptyBtn = document.getElementById('addEmpty');
        const clearListBtn = document.getElementById('clearList');
        const exportBtn = document.getElementById('exportBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const exportTextarea = document.getElementById('exportTextarea');
        const itemCount = document.getElementById('itemCount');
        const exportToggle = document.getElementById('exportToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        const exportContent = document.getElementById('exportContent');
        const confirmOverlay = document.getElementById('confirmOverlay');
        const confirmClearBtn = document.getElementById('confirmClear');
        const cancelClearBtn = document.getElementById('cancelClear');

        // Ключ для сохранения в cookies
        const COOKIE_KEY = 'clipboardListData';

        // Массив для хранения элементов списка
        let listItems = [];

        // Автосохранение таймер
        let saveTimer = null;

        // Состояние экспорта (свёрнут/развёрнут) - по умолчанию свёрнут
        let exportExpanded = false;

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadFromCookies();
            renderList();
            updateButtonsState();

            // Устанавливаем свёрнутое состояние экспорта
            updateExportSectionState();

            // Фокус на последнем элементе при загрузке
            setTimeout(() => {
                focusLastInput();
            }, 100);

            // Настройка обработчиков
            setupEventListeners();
        });

        function setupEventListeners() {
            // Переключение состояния экспорта
            exportToggle.addEventListener('click', toggleExport);

            // Диалог подтверждения очистки
            clearListBtn.addEventListener('click', showConfirmDialog);
            confirmClearBtn.addEventListener('click', performClearList);
            cancelClearBtn.addEventListener('click', hideConfirmDialog);
        }

        // Проверка на Rutube ID
        function isRutubeId(text) {
            // Rutube ID: 32 символа, шестнадцатеричные цифры (0-9, a-f)
            const rutubeIdRegex = /^[0-9a-f]{32}$/i;
            return rutubeIdRegex.test(text.trim());
        }

        // Извлечение Rutube ID из текста
        function extractRutubeId(text) {
            const trimmedText = text.trim();
            if (isRutubeId(trimmedText)) {
                return trimmedText;
            }

            // Попробуем найти ID в строке с другими символами
            const idMatch = trimmedText.match(/[0-9a-f]{32}/i);
            return idMatch ? idMatch[0] : null;
        }

        // Обновление видимого состояния секции экспорта
        function updateExportSectionState() {
            if (exportExpanded) {
                exportContent.classList.add('expanded');
                toggleIcon.textContent = '▼';
            } else {
                exportContent.classList.remove('expanded');
                toggleIcon.textContent = '▶';
            }
        }

        // Переключение состояния экспорта
        function toggleExport() {
            exportExpanded = !exportExpanded;
            updateExportSectionState();
        }

        // Показать диалог подтверждения очистки
        function showConfirmDialog() {
            if (listItems.length > 0) {
                confirmOverlay.style.display = 'flex';
            }
        }

        // Скрыть диалог подтверждения очистки
        function hideConfirmDialog() {
            confirmOverlay.style.display = 'none';
        }

        // Выполнить очистку списка
        function performClearList() {
            listItems = [];
            saveToCookies();
            renderList();
            updateButtonsState();
            hideConfirmDialog();
        }

        // Загрузка списка из cookies
        function loadFromCookies() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(`${COOKIE_KEY}=`)) {
                    const data = cookie.substring(COOKIE_KEY.length + 1);
                    try {
                        listItems = JSON.parse(decodeURIComponent(data));
                    } catch (e) {
                        console.error('Ошибка при загрузке из cookies:', e);
                        listItems = [];
                    }
                    break;
                }
            }
        }

        // Сохранение списка в cookies
        function saveToCookies() {
            if (saveTimer) {
                clearTimeout(saveTimer);
            }

            saveTimer = setTimeout(() => {
                const data = encodeURIComponent(JSON.stringify(listItems));
                // Устанавливаем срок действия на 30 дней
                const expirationDate = new Date();
                expirationDate.setDate(expirationDate.getDate() + 30);

                document.cookie = `${COOKIE_KEY}=${data}; expires=${expirationDate.toUTCString()}; path=/`;
            }, 500);
        }

        // Обновление состояния кнопок
        function updateButtonsState() {
            const hasItems = listItems.length > 0;
            clearListBtn.disabled = !hasItems;
            exportBtn.disabled = !hasItems;
            downloadBtn.disabled = !hasItems;
        }

        // Добавление элемента из буфера обмена с разбиением на строки
        addFromClipboardBtn.addEventListener('click', async function() {
            try {
                // Запрос доступа к буферу обмена
                const clipboardText = await navigator.clipboard.readText();

                if (clipboardText.trim()) {
                    // Разделяем текст на строки
                    const lines = clipboardText.split('\n')
                        .map(line => line.trim())
                        .filter(line => line.length > 0);

                    if (lines.length === 0) {
                        return;
                    }

                    // Если только одна строка - добавляем как один элемент
                    if (lines.length === 1) {
                        addItem(lines[0]);
                    } else {
                        // Если несколько строк - добавляем каждую как отдельный элемент
                        lines.forEach(line => {
                            addItem(line);
                        });
                    }

                    // Фокус на последний элемент
                    setTimeout(() => {
                        focusLastInput();
                    }, 50);
                }
            } catch (err) {
                console.error('Ошибка при чтении буфера обмена:', err);

                // Альтернативный метод для браузеров без поддержки Clipboard API
                const userInput = prompt('Вставьте текст из буфера обмена (Ctrl+V):');
                if (userInput && userInput.trim()) {
                    // Разделяем текст на строки
                    const lines = userInput.split('\n')
                        .map(line => line.trim())
                        .filter(line => line.length > 0);

                    if (lines.length === 0) {
                        return;
                    }

                    // Если только одна строка - добавляем как один элемент
                    if (lines.length === 1) {
                        addItem(lines[0]);
                    } else {
                        // Если несколько строк - добавляем каждую как отдельный элемент
                        lines.forEach(line => {
                            addItem(line);
                        });
                    }

                    // Фокус на последний элемент
                    setTimeout(() => {
                        focusLastInput();
                    }, 50);
                }
            }
        });

        // Добавление пустой строки
        addEmptyBtn.addEventListener('click', function() {
            addItem('');

            // Фокус на новый элемент
            setTimeout(() => {
                focusLastInput();
            }, 50);
        });

        // Экспорт списка в текстовое поле
        exportBtn.addEventListener('click', function() {
            const exportText = listItems.map(item => item.text).join('\n');
            exportTextarea.value = exportText;

            // Развернуть секцию экспорта, если она свёрнута
            if (!exportExpanded) {
                exportExpanded = true;
                updateExportSectionState();
            }

            // Автоматически выделить весь текст для удобного копирования
            exportTextarea.focus();
            exportTextarea.select();
        });

        // Скачивание списка как текстового файла
        downloadBtn.addEventListener('click', function() {
            const exportText = listItems.map(item => item.text).join('\n');
            const blob = new Blob([exportText], {
                type: 'text/plain;charset=utf-8'
            });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'список.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Добавление нового элемента в список
        function addItem(text) {
            const newItem = {
                id: Date.now() + Math.random(), // Уникальный ID
                text: text || ''
            };

            listItems.push(newItem);
            saveToCookies();
            renderList();
            updateButtonsState();
        }

        // Удаление элемента из списка
        function deleteItem(id) {
            listItems = listItems.filter(item => item.id !== id);
            saveToCookies();
            renderList();
            updateButtonsState();
        }

        // Обновление элемента списка
        function updateItem(id, newText) {
            const item = listItems.find(item => item.id === id);
            if (item) {
                item.text = newText;
                saveToCookies();
                return true;
            }
            return false;
        }

        // Фокус на последний input
        function focusLastInput() {
            const inputs = document.querySelectorAll('.list-item-input');
            if (inputs.length > 0) {
                const lastInput = inputs[inputs.length - 1];
                lastInput.focus();
                lastInput.select();
            }
        }

        // Автоматическое изменение высоты textarea при вводе
        function autoResizeTextarea(textarea) {
            textarea.style.height = 'auto';
            const newHeight = Math.max(50, textarea.scrollHeight); // Минимум 50px
            textarea.style.height = newHeight + 'px';

            // Также обновляем высоту родительского элемента
            const listItem = textarea.closest('.list-item');
            if (listItem) {
                listItem.style.minHeight = newHeight + 'px';
            }
        }

        // Отрисовка списка
        function renderList() {
            // Обновляем счетчик элементов
            itemCount.textContent = listItems.length;

            // Если список пуст
            if (listItems.length === 0) {
                itemList.innerHTML = '<li class="empty-list">Список пуст</li>';
                return;
            }

            // Отрисовываем элементы списка
            itemList.innerHTML = '';

            listItems.forEach(item => {
                const listItem = document.createElement('li');
                listItem.className = 'list-item';
                listItem.dataset.id = item.id;

                const contentDiv = document.createElement('div');
                contentDiv.className = 'list-item-content';

                // Каждая строка - всегда textarea для многострочного текста
                const textarea = document.createElement('textarea');
                textarea.className = 'list-item-input';
                textarea.value = item.text;
                textarea.placeholder = "Введите текст...";
                textarea.rows = 1;

                // Автоматическое изменение высоты
                autoResizeTextarea(textarea);

                // Обновление при изменении
                textarea.addEventListener('input', function() {
                    updateItem(item.id, this.value);
                    autoResizeTextarea(this);
                });

                // Автосохранение при потере фокуса
                textarea.addEventListener('blur', function() {
                    updateItem(item.id, this.value);
                });

                // Enter добавляет новый элемент (только если не нажата Ctrl)
                textarea.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) {
                        e.preventDefault();
                        // Добавляем новый элемент после текущего
                        const index = listItems.findIndex(i => i.id === item.id);
                        if (index !== -1) {
                            const newItem = {
                                id: Date.now() + Math.random(),
                                text: ''
                            };
                            listItems.splice(index + 1, 0, newItem);
                            saveToCookies();
                            renderList();
                            updateButtonsState();

                            // Фокус на новый элемент
                            setTimeout(() => {
                                const newTextarea = document.querySelector(`[data-id="${newItem.id}"] .list-item-input`);
                                if (newTextarea) {
                                    newTextarea.focus();
                                }
                            }, 50);
                        }
                    }

                    // Ctrl+Enter добавляет новую строку внутри textarea
                    if (e.key === 'Enter' && e.ctrlKey) {
                        // Разрешаем стандартное поведение - добавление новой строки
                        return;
                    }

                    // Delete или Backspace на пустом поле удаляет элемент
                    if ((e.key === 'Delete' || e.key === 'Backspace') && this.value === '') {
                        e.preventDefault();
                        deleteItem(item.id);
                    }
                });

                contentDiv.appendChild(textarea);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'list-item-actions';

                // Проверяем, содержит ли текст Rutube ID
                const rutubeId = extractRutubeId(item.text);

                // Кнопка Rutube (если есть ID)
                if (rutubeId) {
                    const rutubeBtn = document.createElement('button');
                    rutubeBtn.className = 'rutube-btn';
                    rutubeBtn.title = 'Открыть на Rutube';
                    rutubeBtn.textContent = '▶';
                    rutubeBtn.addEventListener('click', () => {
                        window.open(`https://rutube.ru/video/${rutubeId}/`, '_blank');
                    });
                    actionsDiv.appendChild(rutubeBtn);
                }

                // Кнопка удаления
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.title = 'Удалить';
                deleteBtn.textContent = '×';
                deleteBtn.addEventListener('click', () => deleteItem(item.id));

                actionsDiv.appendChild(deleteBtn);

                listItem.appendChild(contentDiv);
                listItem.appendChild(actionsDiv);

                itemList.appendChild(listItem);
            });
        }
    </script>
</body>


</html>
